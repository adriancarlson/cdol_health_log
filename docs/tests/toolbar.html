<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Missed medication toolbar fixture</title>
    <link href="/images/css/cdol_toolbar_counts.css?v=26.8.0.4" rel="stylesheet">
    <style>
        body { font: 14px Arial, sans-serif; margin: 0; color: #213547; }
        header { background: #20539a; color: white; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; }
        /* Native toolbar layout observed on the test server: 32px icon boxes in a flex row. */
        #tools2 { display: flex; list-style: none; align-items: normal; margin: 0; padding: 0; font-size: 14px; }
        .pds-app-action { display: block; }
        #tools2 li a { padding: 0 5px; display: inline-block; width: 2em; }
        .reference-icon-box { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; }
        .reference-icon { display: block; width: 20px; height: 20px; }
        main { padding: 24px; }
        label, button { margin-right: 12px; }
        pre { padding: 16px; background: #f0f3f6; }
    </style>
</head>
<body>
    <header><strong>Local toolbar fixture — fictional counts</strong><ul id="tools2">
        <li class="pds-app-action"><span class="reference-icon-box"><svg class="reference-icon" viewBox="0 0 20 20" aria-label="Reference icon"><path fill="white" d="m10 0 3 6 7 1-5 5 1 8-6-4-6 4 1-8-5-5 7-1z"/></svg></span></li><li class="pds-app-action" id="help"><span class="reference-icon-box">ⓘ</span></li>
    </ul></header>
    <main>
        <h1>Missed medication counter</h1>
        <p>Tests the shipped counter script and shared stylesheet. No production requests are made.</p>
        <label>Student count <input type="number" id="count" value="12" min="0"></label>
        <label>Response <select id="mode">
            <option value="object">JSON object</option><option value="array">JSON array</option>
            <option value="encoded">HTML-encoded JSON</option><option value="denied">Access denied</option>
            <option value="login">Login HTML</option><option value="error">Request error</option>
        </select></label>
        <button id="refresh">Simulate page load</button><button id="repeat">Render footer again</button>
        <button id="run">Run UI checks</button>
        <p id="requests">Requests: 0</p>
        <pre id="results">Ready</pre>
        <pre id="errors" hidden></pre>
    </main>
    <script>
        const showError = message => {
            const errors = document.getElementById('errors')
            errors.hidden = false
            errors.textContent += message + '\n'
        }
        window.addEventListener('error', event => showError(event.message || `Resource failed: ${event.target.src}`), true)
        window.addEventListener('unhandledrejection', event => showError(String(event.reason)))
        let requests = 0
        window.$j = callback => document.readyState === 'loading'
            ? document.addEventListener('DOMContentLoaded', callback) : callback()
        window.psUtils = { htmlEntitiesToCharCode: text => text.replace(/&quot;/g, '"') }
        $j.ajax = options => {
            let done, fail, always, aborted = false
            const result = {
                done: callback => { done = callback; return result },
                fail: callback => { fail = callback; return result },
                always: callback => { always = callback; return result },
                abort: () => { aborted = true; if (always) always() }
            }
            requests++
            document.getElementById('requests').textContent = `Requests: ${requests}; ${options.method} ${options.url}`
            setTimeout(() => {
                if (aborted) return
                const count = Number(document.getElementById('count').value)
                const mode = document.getElementById('mode').value
                const json = JSON.stringify({ student_count: count })
                if (mode === 'error') fail()
                else done(mode === 'object' ? json : mode === 'array' ? `[${json}]` :
                    mode === 'encoded' ? json.replace(/"/g, '&quot;') :
                    mode === 'denied' ? '{"authorized":false}' : '<html>Sign in</html>')
                always()
            }, 10)
            return result
        }
        const reloadWidget = () => new Promise(resolve => {
            const script = document.createElement('script')
            script.src = '/scripts/cdol_health_log/missedMedicationCount.js?v=26.8.7.15'
            script.onload = resolve
            document.body.append(script)
        })
        const simulatePageLoad = () => {
            window.CDOLMissedMedicationCount.stop()
            return reloadWidget()
        }
        document.getElementById('refresh').onclick = simulatePageLoad
        document.getElementById('repeat').onclick = reloadWidget
        document.getElementById('run').onclick = async () => {
            const results = document.getElementById('results')
            results.textContent = ''
            const wait = () => new Promise(resolve => setTimeout(resolve, 40))
            const check = (condition, name) => {
                results.textContent += `${condition ? 'PASS' : 'FAIL'} ${name}\n`
                if (!condition) throw new Error(name)
            }
            for (const [mode, count, visible] of [
                ['object', 1, true], ['array', 12, true], ['encoded', 120, true],
                ['object', 0, false], ['object', -1, false], ['object', 1.5, false],
                ['denied', 12, false], ['login', 12, false], ['error', 12, false]
            ]) {
                document.getElementById('mode').value = mode
                document.getElementById('count').value = count
                await simulatePageLoad()
                await wait()
                const badge = document.querySelector('.cdol-toolbar-count-badge')
                check(visible ? badge && badge.textContent === String(count) : !badge, `${mode}, count ${count}`)
            }
            document.getElementById('mode').value = 'object'
            document.getElementById('count').value = 12
            await simulatePageLoad()
            await reloadWidget()
            await wait()
            check(document.querySelectorAll('#cdolMissedMedicationCountItem').length === 1, 'Repeated footer stays single')
            check(document.getElementById('help').previousElementSibling.id === 'cdolMissedMedicationCountItem', 'Before Help')
            const link = document.querySelector('#cdolMissedMedicationCountItem a')
            check(link && link.getAttribute('href') === '/admin/reports_pscb_dev_pro/health/cdol_missed_daily_administration.html', 'Exact report link')
            check(!link.hasAttribute('role') && !link.hasAttribute('target') && link.tabIndex === 0, 'Native same-tab keyboard link')
            check(getComputedStyle(link).cursor === 'pointer' && getComputedStyle(link).padding === '0px', 'Clickable without added native padding')
            check(document.querySelector('.cdol-toolbar-count-display').getAttribute('aria-label').includes('12 students'), 'Accessible count')
            const before = requests
            await reloadWidget()
            window.dispatchEvent(new Event('focus'))
            document.dispatchEvent(new Event('visibilitychange'))
            window.dispatchEvent(new Event('pageshow'))
            await wait()
            check(requests === before, 'No refetch on duplicate footer, focus, visibility, or page restore')
            for (const count of [9, 11, 120]) {
                document.getElementById('count').value = count
                await simulatePageLoad()
                await wait()
                const badge = document.querySelector('.cdol-toolbar-count-badge').getBoundingClientRect()
                const icon = document.querySelector('.cdol-toolbar-count-icon').getBoundingClientRect()
                const reference = document.querySelector('.reference-icon').getBoundingClientRect()
                const box = document.querySelector('.cdol-toolbar-count-display').getBoundingClientRect()
                check(Math.abs(icon.y - reference.y) < .1 && icon.height === reference.height, `Artwork aligned for ${count}`)
                check(badge.height === 16 && Math.abs(badge.y - box.y) < .1, `Badge top and height for ${count}`)
                check(count === 9 ? badge.width === badge.height : badge.width > badge.height, `Badge shape for ${count}`)
            }
            results.textContent += 'All 25 UI checks passed.'
        }
    </script>
    <script src="/scripts/cdol_health_log/missedMedicationCount.js?v=26.8.7.15"></script>
</body>
</html>
